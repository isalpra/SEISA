<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Instrumentos de cuerda percutida de Seisa: pianos y más.">
        <title>Cuerda percutida · Seisa</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="css/style.css">

        <style type="text/tailwindcss">
            @custom-variant dark (&:where(.dark, .dark *));

            @theme static {
                /* Colores del modo claro. Los del modo oscuro están en css/styles.css */
                --color-fondo: #f4ecdc;
                --color-texto: #382c25;
                --color-acento: #8f2d00;

                --font-rotulo: "Fraunces", Georgia, serif;
                --font-texto: "Work Sans", system-ui, sans-serif;
            }
        </style>
    </head>


    <body class="flex min-h-dvh flex-col bg-fondo text-texto md:h-dvh md:overflow-hidden">

        <header class="relative flex-none border-b border-texto/20 bg-fondo">
            <nav aria-label="Navegación principal"
                class="flex items-center justify-between px-4 py-3 md:px-8 lg:px-12">

            <a href="index.html" class="flex items-center focus-visible:outline-2 focus-visible:outline-acento">
                <img src="img/logo.png" alt="Seisa, inicio" class="h-10 w-auto object-contain md:h-14 lg:h-16">
            </a>

            <button id="boton-menu" type="button"
                    aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal"
                    class="flex h-12 w-12 items-center justify-center rounded-lg p-1
                            hover:bg-acento/20 focus-visible:outline-2 focus-visible:outline-acento md:hidden">
                <img src="img/menu.png" alt="" class="h-full w-full object-contain">
            </button>

            <ul id="menu-principal"
                class="menu-desplegable hidden absolute left-0 right-0 top-full z-50
                        flex-col gap-1 border-b border-texto/20 bg-fondo p-4
                        md:static md:flex md:flex-row md:gap-8 lg:gap-10
                        md:border-0 md:bg-transparent md:p-0 md:animate-none">
                <li><a href="index.html#novedades"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus-visible:outline-2 focus-visible:outline-acento md:text-lg">Novedades</a></li>
                <li><a href="index.html#categorias"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus-visible:outline-2 focus-visible:outline-acento md:text-lg">Categorías</a></li>
                <li><a href="index.html#informacion"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus-visible:outline-2 focus-visible:outline-acento md:text-lg">Información</a></li>
            </ul>
            </nav>
        </header>

    
        <main class="flex flex-1 flex-col gap-4 px-4 py-4 md:min-h-0 md:gap-5 md:px-8 md:py-5 lg:px-12">
            <h1 class="flex-none text-center font-rotulo text-3xl md:text-4xl">Cuerda percutida</h1>

        
            <ul id="galeria"
                class="grid flex-1 grid-cols-2 gap-2
                    md:min-h-0 md:grid-cols-5 md:grid-rows-3 md:gap-4">
            </ul>
        </main>

    
        <dialog id="ficha" aria-labelledby="ficha-nombre"
            class="modal-producto m-auto w-[min(94vw,64rem)] max-h-[95dvh] overflow-hidden rounded-3xl
                bg-fondo p-0 text-texto shadow-2xl backdrop:bg-black/60 open:block">

            <div class="relative flex max-h-[95dvh] flex-col p-4 md:p-8">

                <button id="ficha-cerrar" type="button" aria-label="Cerrar ficha"
                        class="absolute right-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full
                            border-2 border-texto bg-fondo transition duration-300
                            hover:bg-texto hover:text-fondo
                            focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-acento">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
                </button>

            
                <div class="grid min-h-0 flex-1 grid-cols-2 grid-rows-[auto_minmax(0,1fr)_auto] gap-x-4 gap-y-3
                            md:grid-cols-[1fr_1.3fr_1fr] md:grid-rows-1 md:items-center md:gap-x-10">

                <h2 id="ficha-nombre"
                    class="col-span-2 pr-10 text-center font-rotulo text-xl uppercase md:col-span-1 md:pr-0 md:text-3xl"></h2>

                
                <figure class="col-span-2 flex min-h-0 flex-col gap-2 md:col-span-1">
                    <div class="min-h-0 flex-1 md:aspect-square md:flex-none">
                    <img id="ficha-imagen" src="" alt=""
                        class="h-full w-full rounded-xl bg-white object-contain">
                    </div>
                    <figcaption id="ficha-precio" class="font-texto text-lg font-semibold md:text-xl"></figcaption>
                </figure>

                
                <dl id="ficha-datos"
                    class="col-span-2 grid grid-cols-2 gap-x-4 gap-y-2 font-texto text-sm
                            md:col-span-1 md:flex md:flex-col md:gap-3 md:text-base"></dl>
                </div>
            </div>
        </dialog>

        
        <button id="boton-tema" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false"
                class="fixed bottom-4 left-4 z-40 flex h-12 w-12 items-center justify-center rounded-full
                        bg-texto text-fondo shadow-lg transition duration-300 hover:scale-110
                        focus-visible:scale-110 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-acento
                        md:bottom-6 md:left-6">
            <svg class="h-6 w-6 dark:hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
            <svg class="hidden h-6 w-6 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
        </button>

    
        <button id="boton-musica" type="button" aria-label="Reproducir música" aria-pressed="false"
                class="boton-musica fixed bottom-4 right-4 z-40 flex h-12 w-12 items-center justify-center rounded-full
                        bg-acento text-fondo shadow-lg transition duration-300
                        hover:scale-110 focus-visible:scale-110
                        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-texto
                        md:bottom-6 md:right-6">
            <svg id="icono-play" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7Z"/>
            </svg>
            <svg id="icono-pausa" class="hidden h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
            </svg>
        </button>

        <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
        <script src="js/script.js"></script>
        <script src="js/percutida.js"></script>
    </body>
</html>
