<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seisa</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   
     <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">

     <style type="text/tailwindcss">
        /* Modo oscuro con la clase .dark en <html> (la pone el JavaScript) */
        @custom-variant dark (&:where(.dark, .dark *));

        @theme static {
            /* Colores del modo claro. Los del modo oscuro están en css/styles.css */
            --color-fondo: #f4ecdc;
            --color-texto: #2a1a10;
            --color-acento: #93362a;

            --font-rotulo: "Fraunces", Georgia, serif;
            --font-texto: "Work Sans", system-ui, sans-serif;
        }
    </style>
</head>
<body class="bg-fondo text-texto">
    <header class="relative bg-fondo border-b border-texto/20">
        <nav aria-label="Navegación principal"
            class="mx-auto flex  items-center justify-between px-4 py-3">

            <!-- Logo: la altura es fija y el ancho se adapta a la proporción de la imagen -->
            <a href="#portada" class="flex items-center focus:outline-2 focus:outline-acento">
            <img src="img/logo.png" alt="Seisa, inicio"
                class="h-10 w-auto object-contain md:h-14">
            </a>

            <!-- Botón con imagen (solo móvil) -->
            <button id="boton-menu" type="button"
                    aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal"
                    class="flex h-12 w-12 items-center justify-center rounded-lg p-1
                        hover:bg-acento/20 focus:outline-none focus:outline-acento md:hidden">
            <img src="img/menu.png" alt="" class="h-full w-full object-contain">
            </button>

            <!-- Enlaces: desplegable en móvil, fila horizontal desde md -->
            <ul id="menu-principal"
                class="menu-desplegable hidden absolute left-0 right-0 top-full z-50
                    flex-col gap-1 border-b border-texto/20 bg-fondo p-4
                    md:static md:flex md:flex-row md:gap-8 md:border-0 md:bg-transparent md:p-0 md:animate-none">
            <li><a href="#novedades"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus:outline-2 focus:outline-acento">Novedades</a></li>
            <li><a href="#categorias"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus:outline-2 focus:outline-acento">Categorías</a></li>
            <li><a href="#informacion"
                    class="block rounded px-3 py-2 font-texto hover:text-acento focus:outline-2 focus:outline-acento">Información</a></li>
            </ul>
        </nav>
    </header>
   <main>
    <!-- <button id="boton-tema">Dark</button> -->
    <section id="portada" class="min-h-screen">

    </section>
    <section id="novedades" class="min-h-screen">

    </section>
    <section id="categorias" aria-labelledby="titulo-categorias"
         class="relative h-screen overflow-hidden p-3 md:p-6">
        <h2 id="titulo-categorias" class="sr-only">Categorías</h2>

        <!-- Tarjeta 1: Percutida -->
        <article class="tarjeta-categoria absolute inset-3 md:inset-6 grid grid-rows-2 md:grid-rows-1 md:grid-cols-2
                        overflow-hidden rounded-3xl bg-acento text-fondo shadow-2xl">
            <div class="flex flex-col items-start justify-center gap-6 p-6 md:p-12 order-2 md:order-1">
            <h3 class="font-rotulo text-5xl uppercase md:text-7xl">Percutida</h3>
            <a href="percutida.html"
                class="group inline-flex items-center gap-2 rounded-full border-2 border-fondo px-6 py-3
                        font-texto uppercase tracking-wide transition duration-300
                        hover:-translate-y-1 hover:bg-fondo hover:text-texto
                        focus-visible:-translate-y-1 focus-visible:bg-fondo focus-visible:text-texto
                        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-fondo">
                Ver percutida
                <span aria-hidden="true"
                    class="inline-block transition-transform duration-300
                            group-hover:translate-x-1.5 group-focus-visible:translate-x-1.5">→</span>
            </a>
            </div>
            <img src="img/percutida.jpg" alt="Instrumentos de percusión"
                class="order-1 md:order-2 h-full w-full object-cover">
        </article>

        <!-- Tarjeta 2: Frotada -->
        <article class="tarjeta-categoria absolute inset-3 md:inset-6 grid grid-rows-2 md:grid-rows-1 md:grid-cols-2
                        overflow-hidden rounded-3xl bg-texto text-fondo shadow-2xl">
            <div class="flex flex-col items-start justify-center gap-6 p-6 md:p-12 order-2 md:order-1">
            <h3 class="font-rotulo text-5xl uppercase md:text-7xl">Frotada</h3>
            <a href="frotada.html"
                class="group inline-flex items-center gap-2 rounded-full border-2 border-fondo px-6 py-3
                        font-texto uppercase tracking-wide transition duration-300
                        hover:-translate-y-1 hover:bg-fondo hover:text-texto
                        focus-visible:-translate-y-1 focus-visible:bg-fondo focus-visible:text-texto
                        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-fondo">
                Ver frotada
                <span aria-hidden="true"
                    class="inline-block transition-transform duration-300
                            group-hover:translate-x-1.5 group-focus-visible:translate-x-1.5">→</span>
            </a>
            </div>
            <img src="img/frotada.jpg" alt="Instrumentos de cuerda frotada"
                class="order-1 md:order-2 h-full w-full object-cover">
        </article>

        <!-- Tarjeta 3: Pulsada -->
        <article class="tarjeta-categoria absolute inset-3 md:inset-6 grid grid-rows-2 md:grid-rows-1 md:grid-cols-2
                        overflow-hidden rounded-3xl bg-acento text-fondo shadow-2xl">
            <div class="flex flex-col items-start justify-center gap-6 p-6 md:p-12 order-2 md:order-1">
            <h3 class="font-rotulo text-5xl uppercase md:text-7xl">Pulsada</h3>
            <a href="pulsada.html"
                class="group inline-flex items-center gap-2 rounded-full border-2 border-fondo px-6 py-3
                        font-texto uppercase tracking-wide transition duration-300
                        hover:-translate-y-1 hover:bg-fondo hover:text-texto
                        focus-visible:-translate-y-1 focus-visible:bg-fondo focus-visible:text-texto
                        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-fondo">
                Ver pulsada
                <span aria-hidden="true"
                    class="inline-block transition-transform duration-300
                            group-hover:translate-x-1.5 group-focus-visible:translate-x-1.5">→</span>
            </a>
            </div>
            <img src="img/pulsada.jpg" alt="Instrumentos de cuerda pulsada"
                class="order-1 md:order-2 h-full w-full object-cover">
        </article>
    </section>
    <section id="información" class="min-h-screen">

    </section>
   </main>
   <footer>

   </footer>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/script.js"></script>
   
</body>
</html>
